syntax = "proto3";

package gamepb.activitypb;

import "corepb.proto";

// 以薯换福（官方内部名 maple_market），2026-11-25 实机协议。
// 字段号来自实机抓包；本文件独立于 activitypb.proto，
// 与 milk-tea.proto / muge.proto 一致：自有 Request/Reply，不共用大文件。

message SweetPotatoHead {
    int64 activity_id = 1;
    int64 group_id = 2;
    int64 type = 3;
    string name = 4;
    bytes extra = 5;
    int64 begin_time = 6;
    int64 end_time = 7;
    int64 sort_order = 8;
    int64 field_20 = 20;
    int64 field_21 = 21;
    int64 field_22 = 22;
    int64 field_23 = 23;
    int64 settle_start_time = 24;
}

message SweetPotatoDailyState {
    bool seed_claimed = 1;
    bool shared = 2;
}

message SweetPotatoRedDots {
    bool seed_unclaimed = 1;
    bool boost_unread = 2;
    bool share_unclaimed = 3;
    bool exchangeable = 4;
    bool purchase_log_unread = 5;
    bool commission_unclaimed = 6;
}

message SweetPotatoBody {
    SweetPotatoDailyState daily_state = 1;
    int64 activity_coin = 3;
    SweetPotatoRedDots red_dots = 4;
    int64 base_price = 5;
    int64 boost_value = 6;
    int64 price_rate_bp = 7;
    int64 pending_commission_coin = 11;
    int64 pending_commission_count = 13;
}

message SweetPotatoNode {
    SweetPotatoHead activity = 1;
    repeated SweetPotatoNode children = 2;
    SweetPotatoBody maple_market = 130;
}

message SweetPotatoGroupReply {
    SweetPotatoNode group = 1;
}

message SweetPotatoEmpty {}

message SweetPotatoClaimSeedReq {}
message SweetPotatoClaimSeedRsp {
    corepb.Item seed = 1;
}

message SweetPotatoGetShopReq {
    int64 target_gid = 1;
}
message SweetPotatoShopOwner {
    int64 gid = 1;
    string name = 2;
    string avatar = 3;
    int64 level = 4;
}
message SweetPotatoShopInfo {
    int64 base_price = 1;
    int64 boost_value = 2;
    int64 remain_quota = 3;
    SweetPotatoShopOwner owner = 4;
}
message SweetPotatoGetShopRsp {
    SweetPotatoShopInfo shop = 1;
    bool can_sell = 2;
}

message SweetPotatoSellReq {
    int64 target_gid = 1;
    int64 sell_count = 2;
}
message SweetPotatoSellRsp {
    int64 sold_count = 1;
    int64 final_price = 2;
    int64 activity_coin_income = 3;
    int64 remain_quota = 4;
    int64 activity_coin = 5;
    int64 income_gold = 6;
}

message SweetPotatoGetPurchaseLogReq {}
message SweetPotatoPurchaseRecord {
    int64 timestamp = 1;
    int64 seller_gid = 2;
    int64 sold_count = 3;
    int64 income = 4;
    string seller_name = 6;
    string seller_avatar = 7;
    int64 seller_level = 8;
    int64 commission = 9;
}
message SweetPotatoGetPurchaseLogRsp {
    repeated SweetPotatoPurchaseRecord records = 1;
}

message SweetPotatoGoods {
    int64 goods_id = 1;
    int64 activity_coin_price = 2;
    int32 limit_type = 3;
    int64 limit_times = 4;
    int64 purchased_daily = 5;
    int64 purchased_total = 6;
    bool exchangeable = 7;
}
message SweetPotatoGetGoodsReq {}
message SweetPotatoGetGoodsRsp {
    repeated SweetPotatoGoods goods = 1;
    int64 activity_coin = 2;
}
message SweetPotatoExchangeReq {
    int64 goods_id = 1;
    int64 exchange_count = 2;
}
message SweetPotatoExchangeRsp {
    int64 activity_coin_cost = 1;
    repeated corepb.Item items = 2;
    int64 activity_coin = 3;
    int64 purchased_daily = 4;
    int64 purchased_total = 5;
}

message SweetPotatoClaimCommissionRsp {
    int64 claimed_coin = 1;
    int64 claimed_count = 3;
    int64 activity_coin = 4;
}

message SweetPotatoOperateRequest {
    int64 id = 1;
    int64 cmd = 2;
    SweetPotatoClaimSeedReq maple_market_claim_seed = 191;
    SweetPotatoGetShopReq maple_market_get_shop = 192;
    SweetPotatoSellReq maple_market_sell = 193;
    SweetPotatoGetPurchaseLogReq maple_market_get_purchase_log = 195;
    SweetPotatoExchangeReq maple_market_exchange = 196;
    SweetPotatoGetGoodsReq maple_market_get_goods_list = 197;
    SweetPotatoEmpty maple_market_share = 198;
}

message SweetPotatoOperateReply {
    int64 id = 1;
    int64 cmd = 2;
    SweetPotatoNode data = 3;
    SweetPotatoClaimSeedRsp maple_market_claim_seed = 191;
    SweetPotatoGetShopRsp maple_market_get_shop = 192;
    SweetPotatoSellRsp maple_market_sell = 193;
    SweetPotatoGetPurchaseLogRsp maple_market_get_purchase_log = 195;
    SweetPotatoExchangeRsp maple_market_exchange = 196;
    SweetPotatoGetGoodsRsp maple_market_get_goods_list = 197;
    SweetPotatoEmpty maple_market_share = 198;
    SweetPotatoClaimCommissionRsp maple_market_claim_commission = 199;
}
